name: clinic_schedule
description: "Clinic Schedule — book and manage appointments (patients and clinic admin)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  clock: ^1.1.2
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.1
  collection: ^1.19.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  meta: ^1.17.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  min_sdk_android: 24
