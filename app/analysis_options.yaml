include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/l10n/gen/**

formatter:
  page_width: 120

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # Same width as the other HomiLabs apps (formatter page_width above).
    lines_longer_than_80_chars: false
    # ClinicApi is a deliberate one-method seam so tests can fake the server.
    one_member_abstracts: false
