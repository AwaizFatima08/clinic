<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Clinic Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/admin.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div>
        <h1>Clinic Admin</h1>
        <p id="admin-sub">Appointments, opening hours and settings</p>
      </div>
      <div class="actions">
        <a class="btn secondary" href="/" target="_blank" rel="noopener">Patient page</a>
        <button class="btn secondary hidden" id="logout" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="login" class="card narrow hidden">
      <h2>Log in</h2>
      <form id="login-form">
        <div class="field">
          <label for="pw">Admin password</label>
          <input id="pw" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-msg"></div>
        <button class="btn" type="submit">Log in</button>
      </form>
    </section>

    <div id="app" class="hidden">
      <div id="global-warn"></div>
      <nav class="tabs" role="tablist">
        <button type="button" data-tab="appointments" class="active">Appointments</button>
        <button type="button" data-tab="calendar">Daily hours</button>
        <button type="button" data-tab="weekly">Weekly timetable</button>
        <button type="button" data-tab="settings">Settings</button>
      </nav>

      <section data-panel="appointments">
        <div class="card">
          <div class="toolbar">
            <div class="field">
              <label for="ap-from">From</label>
              <input type="date" id="ap-from">
            </div>
            <div class="field">
              <label for="ap-to">To</label>
              <input type="date" id="ap-to">
            </div>
            <div class="field">
              <label for="ap-status">Status</label>
              <select id="ap-status">
                <option value="">All</option>
                <option value="booked">Booked</option>
                <option value="completed">Completed</option>
                <option value="no_show">No-show</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <button class="btn secondary" type="button" id="ap-today">Today</button>
            <button class="btn" type="button" id="ap-new">+ New appointment</button>
          </div>
          <div id="ap-msg"></div>
          <div class="table-scroll"><table>
            <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Contact</th><th>Reason</th><th>Status</th><th></th></tr></thead>
            <tbody id="ap-rows"></tbody>
          </table></div>
        </div>

        <div class="card hidden" id="new-card">
          <h2>New appointment (booked by clinic)</h2>
          <form id="new-form">
            <div class="row">
              <div class="field">
                <label for="n-date">Date</label>
                <input type="date" id="n-date" required>
              </div>
              <div class="field">
                <label for="n-slot">Free time</label>
                <select id="n-slot" required></select>
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="n-name">Patient name</label>
                <input id="n-name" maxlength="80" required>
              </div>
              <div class="field">
                <label for="n-phone">Phone</label>
                <input id="n-phone" type="tel" maxlength="20" required>
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="n-email">Email <span class="hint">optional</span></label>
                <input id="n-email" type="email" maxlength="120">
              </div>
              <div class="field">
                <label for="n-reason">Reason <span class="hint">optional</span></label>
                <input id="n-reason" maxlength="500">
              </div>
            </div>
            <div id="new-msg"></div>
            <div class="actions">
              <button class="btn" type="submit">Book</button>
              <button class="btn secondary" type="button" id="new-cancel">Close</button>
            </div>
          </form>
        </div>
      </section>

      <section data-panel="calendar" class="hidden">
        <div class="card">
          <h2>Opening hours, day by day</h2>
          <p class="muted small" id="cal-mode-note"></p>
          <div class="toolbar">
            <div class="field">
              <label for="cal-from">Start from</label>
              <input type="date" id="cal-from">
            </div>
            <button class="btn secondary" type="button" id="cal-prev">← 2 weeks</button>
            <button class="btn secondary" type="button" id="cal-next">2 weeks →</button>
          </div>
          <div id="cal-msg"></div>
          <div id="cal-days"></div>
        </div>
      </section>

      <section data-panel="weekly" class="hidden">
        <div class="card">
          <h2>Weekly timetable</h2>
          <p class="muted small" id="week-mode-note"></p>
          <div id="week-days"></div>
          <div id="week-msg"></div>
          <button class="btn" type="button" id="week-save">Save weekly timetable</button>
        </div>
      </section>

      <section data-panel="settings" class="hidden">
        <div class="card">
          <h2>Clinic settings</h2>
          <form id="settings-form">
            <div class="row">
              <div class="field">
                <label for="s-clinic_name">Clinic name</label>
                <input id="s-clinic_name" maxlength="80" required>
              </div>
              <div class="field">
                <label for="s-doctor_name">Doctor name / title</label>
                <input id="s-doctor_name" maxlength="80">
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="s-slot_minutes">Appointment (slot) length, minutes</label>
                <select id="s-slot_minutes"></select>
                <span class="hint">Applies to new bookings. Existing appointments keep their time.</span>
              </div>
              <div class="field">
                <label for="s-schedule_mode">How days open</label>
                <select id="s-schedule_mode">
                  <option value="weekly">Automatically from the weekly timetable</option>
                  <option value="daily">Only days I activate in “Daily hours”</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="s-booking_window_days">Patients can book up to … days ahead</label>
                <input id="s-booking_window_days" type="number" min="1" max="365" required>
              </div>
              <div class="field">
                <label for="s-min_notice_minutes">Minimum notice before a slot, minutes</label>
                <input id="s-min_notice_minutes" type="number" min="0" max="10080" required>
              </div>
            </div>
            <div class="field">
              <label for="s-timezone">Clinic time zone</label>
              <input id="s-timezone" required placeholder="Asia/Karachi">
            </div>
            <div class="field">
              <label for="s-instructions">Message shown to patients after booking</label>
              <textarea id="s-instructions" maxlength="1000"></textarea>
            </div>
            <div id="settings-msg"></div>
            <button class="btn" type="submit">Save settings</button>
          </form>
        </div>

        <div class="card">
          <h2>Change admin password</h2>
          <form id="pw-form">
            <div class="row">
              <div class="field">
                <label for="pw-current">Current password</label>
                <input id="pw-current" type="password" autocomplete="current-password" required>
              </div>
              <div class="field">
                <label for="pw-next">New password <span class="hint">at least 8 characters</span></label>
                <input id="pw-next" type="password" autocomplete="new-password" minlength="8" required>
              </div>
            </div>
            <div id="pw-msg"></div>
            <button class="btn" type="submit">Change password</button>
          </form>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
