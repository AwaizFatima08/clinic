<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an Appointment</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div>
        <h1 id="clinic-name">Online Clinic</h1>
        <p id="doctor-name"></p>
      </div>
      <button class="btn secondary" id="manage-toggle" type="button">My appointment</button>
    </div>
  </header>

  <main class="wrap">
    <section id="manage" class="card hidden" aria-labelledby="manage-title">
      <h2 id="manage-title">Find or cancel your appointment</h2>
      <form id="lookup-form">
        <div class="row">
          <div class="field">
            <label for="lk-ref">Booking reference</label>
            <input id="lk-ref" autocomplete="off" maxlength="6" required placeholder="e.g. K7Q2MX">
          </div>
          <div class="field">
            <label for="lk-phone">Phone number used to book</label>
            <input id="lk-phone" type="tel" autocomplete="tel" required>
          </div>
        </div>
        <button class="btn" type="submit">Find appointment</button>
      </form>
      <div id="lookup-msg"></div>
      <div id="lookup-result"></div>
    </section>

    <div id="booking">
      <section class="card" aria-labelledby="date-title">
        <h2 id="date-title"><span class="step-num">1</span>Choose a day</h2>
        <div id="days" class="days" role="list"></div>
        <p class="muted small" id="tz-note"></p>
      </section>

      <section class="card" aria-labelledby="slot-title">
        <h2 id="slot-title"><span class="step-num">2</span>Choose a time</h2>
        <div id="slots-msg"></div>
        <div id="slots"></div>
      </section>

      <section class="card hidden" id="form-card" aria-labelledby="form-title">
        <h2 id="form-title"><span class="step-num">3</span>Your details</h2>
        <div class="summary" id="choice-summary"></div>
        <form id="book-form" novalidate>
          <div class="row">
            <div class="field">
              <label for="f-name">Full name</label>
              <input id="f-name" autocomplete="name" maxlength="80" required>
            </div>
            <div class="field">
              <label for="f-phone">Phone / WhatsApp <span class="hint">used to find your booking</span></label>
              <input id="f-phone" type="tel" autocomplete="tel" maxlength="20" required placeholder="+92 300 1234567">
            </div>
          </div>
          <div class="field">
            <label for="f-email">Email <span class="hint">optional</span></label>
            <input id="f-email" type="email" autocomplete="email" maxlength="120">
          </div>
          <div class="field">
            <label for="f-reason">Reason for visit <span class="hint">optional, max 500 characters</span></label>
            <textarea id="f-reason" maxlength="500"></textarea>
          </div>
          <div id="book-msg"></div>
          <button class="btn" type="submit" id="book-btn">Confirm appointment</button>
        </form>
      </section>
    </div>

    <section class="card hidden" id="done" aria-live="polite">
      <h2>Your appointment is booked</h2>
      <p class="muted">Please save your booking reference. You need it, with your phone number, to view or cancel the appointment.</p>
      <div class="summary">
        <div class="muted small">Booking reference</div>
        <div class="ref" id="done-ref"></div>
        <div id="done-when"></div>
      </div>
      <p id="done-instructions"></p>
      <button class="btn secondary" type="button" id="book-another">Book another appointment</button>
    </section>
  </main>
</body>
</html>
